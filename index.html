<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>冰河地形配對</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#e9f1f5;color:#17384c}header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#17384c;color:white;height:48px}header strong{white-space:nowrap}#msg{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button{font:inherit;border:0;border-radius:8px;padding:7px 12px;background:#dceaf2;color:#17384c;cursor:pointer}#field{position:relative;height:calc(100dvh - 48px);overflow:hidden;touch-action:none;background:radial-gradient(ellipse at top,#f8fcff,#d6e5ed)}.ball{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7px;border:2px solid #91a9ba;background:#fff;box-shadow:0 3px 8px #16384c25;user-select:none;touch-action:none;overflow:hidden;font-size:clamp(9px,1.2vw,14px);line-height:1.2;cursor:grab}.ball img{width:100%;height:100%;object-fit:cover;pointer-events:none}.ball.hasimg{padding:0}.ball.hasimg span{position:absolute;bottom:12%;background:#fffD;padding:3px;border-radius:5px;font-weight:bold}.ball.selected{outline:4px solid #eea843;z-index:5}.ball.merged{background:#e6f2f9;border-color:#507e9c;font-weight:bold}.ball.category{background:#d4e8de;border-color:#669984}.ball small{font-size:10px}.ball.drag{z-index:20;opacity:.9}dialog{border:0;border-radius:14px;width:min(950px,96vw);max-height:90dvh;padding:18px;box-shadow:0 10px 50px #0005}dialog::backdrop{background:#17384c88}.editrow{display:grid;grid-template-columns:120px 1fr 1fr 1fr;gap:8px;padding:12px 0;border-bottom:1px solid #ddd}.editrow input,.editrow textarea{width:100%;font:inherit;font-size:13px}.editrow img{width:70px;height:55px;object-fit:cover}.editrow label{display:block;font-size:12px}#editlist{overflow:auto;max-height:65dvh}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}@media(max-width:650px){.editrow{grid-template-columns:1fr 1fr}header strong{font-size:13px}header button{padding:6px;font-size:12px}}
#login,#ranking,#result{width:min(520px,94vw)}input.player{width:100%;padding:12px;font:inherit;border:1px solid #91a9ba;border-radius:8px}#stats{font-size:12px;white-space:nowrap}table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left;border-bottom:1px solid #ddd;font-size:13px}#ranking section{max-height:55vh;overflow:auto}.primary{background:#17384c;color:white} @media(max-width:800px){header strong{display:none}#stats{font-size:10px}header button{padding:5px;font-size:11px}}
</style><header><strong>冰河地形配對</strong><span id="msg" role="status"></span><span id="stats"></span><button id="reset">重玩</button><button id="full">全螢幕</button></header><main id="field" aria-label="遊戲區"></main><dialog id="login"><h2>冰河地形配對挑戰</h2><form id="join"><label>玩家名稱／班級座號<input class="player" id="player" required maxlength="30" autocomplete="off" placeholder="例如 111-05"></label><p>分數＝正確率 × 800 ＋ 速度分（最高 200）。完成後才列入排名。</p><button class="primary" type="submit">開始挑戰</button></form><div class="actions"></div></dialog><dialog id="result"><h2>挑戰完成</h2><p id="resultText"></p><p id="submitStatus"></p><div class="actions"><button id="retrySubmit">重試送出</button><button id="again">下一位玩家</button></div></dialog><script>
const groups=['冰蝕地形','冰磧堆積','冰水堆積'];const raw=[['冰斗','高山冰河源頭的半碗狀凹地',0],['角峰','多個冰斗向源侵蝕形成的尖銳山峰',0],['刃嶺','相鄰冰斗侵蝕形成的狹窄刀刃狀山稜',0],['冰河槽','冰河拓寬加深形成的U形谷',0],['懸谷','支冰河谷底高於主冰河谷底',0],['峽灣','冰河槽被海水淹沒形成狹長海灣',0],['槽湖','冰河槽內低窪處積水形成的狹長湖泊',0],['冰蝕湖','冰河侵蝕形成的凹地積水成湖',0],['羊背石','迎冰面平緩磨光，背冰面陡峭粗糙',0],['冰磧平原','冰河直接堆積形成的較平坦地面',1],['鼓丘','冰河作用形成的流線形丘陵，常含冰磧物',1],['端磧','冰河末端堆積形成的弧形堤丘',1],['蛇丘','冰下或冰內融水沉積形成的蜿蜒長丘',2],['外洗扇','融水流出冰河末端後形成的扇形堆積',2],['外洗平原','融水搬運砂礫形成的廣闊平緩堆積地',2]];let cards=raw.map(([name,desc,group],id)=>({id,name,desc,group,photo:'',contour:''}));const $=id=>document.getElementById(id),field=$('field');let balls=[],selected=null,drag=null,seq=0,base=80,merges=0;let player='',started=0,wrong=0,finished=false,pending=null,sending=false;
const API_URL='https://script.google.com/macros/s/AKfycbwJ8pIWRXzuU4JSo10YQaEEdqrXFNfsR2sJrNl_7UBMYH-2OfBG2EEx0ZBCoDl0NYcEiw/exec';

const totals=[9,3,3];const say=s=>$('msg').textContent=s;
function radius(b){return base*Math.min(2.6,Math.sqrt(b.mass))/2}function clamp(b){let r=radius(b);b.x=Math.max(r,Math.min(field.clientWidth-r,b.x));b.y=Math.max(r,Math.min(field.clientHeight-r,b.y))}function place(b){clamp(b);let r=radius(b);Object.assign(b.el.style,{width:r*2+'px',height:r*2+'px',left:b.x-r+'px',top:b.y-r+'px'})}function add(b){b.uid=++seq;b.el=document.createElement('div');b.el.className='ball '+(b.stage>0?'merged ':'')+(b.stage>=2?'category':'');b.el.tabIndex=0;b.el.setAttribute('role','button');let c=cards[b.id];let txt='',src='';if(b.stage===0){if(b.parts.length===1){let p=b.parts[0];txt=p==='desc'?c.desc:p==='photo'?'照片待上傳':'等高線待上傳';src=p==='photo'?c.photo:p==='contour'?c.contour:''}else{txt='已配對 '+b.parts.length+'/3';src=b.parts.includes('photo')?c.photo:b.parts.includes('contour')?c.contour:''}}else if(b.stage===1){txt=c.name;src=c.photo}else if(b.stage===2){txt=groups[b.group]+' '+b.ids.length+'/'+totals[b.group]}else txt=b.stage===3?'冰河堆積':'冰河地形';if(src){let img=document.createElement('img');img.src=src;img.alt=txt;b.el.append(img);b.el.classList.add('hasimg');if(b.stage===0&&b.parts.length===1)txt=''}if(txt){let s=document.createElement('span');s.textContent=txt;b.el.append(s)}b.el.setAttribute('aria-label',txt||'圖卡');b.el.onpointerdown=e=>down(e,b);b.el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(b)}};field.append(b.el);balls.push(b);place(b);return b}
function start(){field.replaceChildren();balls=[];selected=null;drag=null;merges=0;wrong=0;finished=false;started=performance.now();let w=field.clientWidth,h=field.clientHeight;let cols=Math.max(1,Math.ceil(Math.sqrt(45*w/h))),rows=Math.ceil(45/cols);base=Math.min(112,w/cols*.88,h/rows*.88);let items=cards.flatMap(c=>['photo','desc','contour'].map(p=>({stage:0,id:c.id,parts:[p],mass:1})));for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}items.forEach((b,i)=>{b.x=(i%cols+.5)*w/cols;b.y=(Math.floor(i/cols)+.5)*h/rows;add(b)});say('拖曳或依序點選兩球進行配對｜45 顆初始球')}
function category(b){return b.stage===1?cards[b.id].group:b.group}function ids(b){return b.stage===1?[b.id]:b.ids}function recipe(a,b){if(a.stage===0&&b.stage===0&&a.id===b.id&&!a.parts.some(p=>b.parts.includes(p))){let parts=[...a.parts,...b.parts];return {stage:parts.length===3?1:0,id:a.id,parts}}if([1,2].includes(a.stage)&&[1,2].includes(b.stage)&&category(a)===category(b)){return {stage:2,group:category(a),ids:[...ids(a),...ids(b)]}}if(a.stage===2&&b.stage===2&&a.ids.length===totals[a.group]&&b.ids.length===totals[b.group]&&[a.group,b.group].sort().join()==='1,2')return {stage:3};if((a.stage===3&&b.stage===2&&b.group===0&&b.ids.length===9)||(b.stage===3&&a.stage===2&&a.group===0&&a.ids.length===9))return {stage:4};return null}
function clearSelect(){if(selected)selected.el.classList.remove('selected');selected=null}function merge(a,b){let r=recipe(a,b);clearSelect();if(!r){wrong++;updateStats();say('這兩張字卡不能合成，再觀察看看。');return false}for(let x of [a,b])x.el.remove();balls=balls.filter(x=>x!==a&&x!==b);let n=add({...r,x:(a.x+b.x)/2,y:(a.y+b.y)/2,mass:a.mass+b.mass});merges++;updateStats();say(r.stage===4?'過關！成功合成冰河地形。':'配對成功｜剩餘 '+balls.length+' 顆球');if(r.stage===4){n.x=field.clientWidth/2;n.y=field.clientHeight/2;place(n);finish()}return true}
function tap(b){if(finished||!player)return;if(selected&&selected!==b){merge(selected,b)}else if(selected===b)clearSelect();else{selected=b;b.el.classList.add('selected');say('已選取一球，請點選另一球')}}function down(e,b){if(drag||finished||!player)return;e.preventDefault();b.el.setPointerCapture(e.pointerId);drag={b,id:e.pointerId,sx:e.clientX,sy:e.clientY,x:b.x,y:b.y,moved:false};b.el.classList.add('drag')}
field.onpointermove=e=>{if(!drag||e.pointerId!==drag.id)return;let d=drag,dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(Math.hypot(dx,dy)>5)d.moved=true;if(d.moved){d.b.x=d.x+dx;d.b.y=d.y+dy;place(d.b)}};field.onpointerup=e=>{if(!drag||e.pointerId!==drag.id)return;let d=drag;drag=null;d.b.el.classList.remove('drag');if(!d.moved){tap(d.b);return}let p=field.getBoundingClientRect(),x=e.clientX-p.left,y=e.clientY-p.top;let targets=balls.filter(b=>b!==d.b&&Math.hypot(b.x-x,b.y-y)<=radius(b)).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y));if(targets.length&&!merge(d.b,targets[0])){d.b.x=d.x;d.b.y=d.y;place(d.b)}};field.onpointercancel=()=>{if(drag){drag.b.el.classList.remove('drag');drag=null}};window.addEventListener('resize',()=>{balls.forEach(place)});$('reset').onclick=()=>{if(sending||pending){say('請先完成成績送出');return}if(!player||finished||confirm('本次成績將不列入排名，確定重玩？'))newPlayer()};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>say('此瀏覽器不支援全螢幕'));else say('iPad 可透過 Safari 加入主畫面使用')};
function valid(data){return Array.isArray(data)&&data.length===15&&data.every((c,i)=>c.id===i&&c.group===raw[i][2]&&c.name===raw[i][0]&&typeof c.desc==='string'&&typeof c.photo==='string'&&typeof c.contour==='string')}
async function init(){ $('join').querySelector('button').disabled=true; try{if(!API_URL)throw Error('尚未設定 GAS 網址');let res=await fetch(API_URL+'?action=cards&t='+Date.now());let d=await res.json();if(!d.ok||!valid(d.cards))throw Error('教材尚未發布');cards=d.cards;newPlayer();$('join').querySelector('button').disabled=false;}catch(e){newPlayer();$('login').querySelector('p').textContent='教材讀取失敗：'+e.message+'。請通知教師並重新整理。';}}init();
function newPlayer(){player='';finished=true;field.replaceChildren();balls=[];if($('result').open)$('result').close();$('stats').textContent='';say('請輸入玩家名稱');if(!$('login').open)$('login').showModal()}
$('login').addEventListener('cancel',e=>e.preventDefault());$('result').addEventListener('cancel',e=>e.preventDefault());$('join').onsubmit=e=>{e.preventDefault();player=$('player').value.trim();if(!player)return;$('login').close();start();updateStats()};
function seconds(){return Math.max(1,Math.ceil((performance.now()-started)/1000))}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function accuracy(){return merges+wrong?merges/(merges+wrong):1}function updateStats(){if(player&&!finished)$('stats').textContent=player+' ｜ '+fmt(seconds())+' ｜ '+Math.round(accuracy()*100)+'%'}setInterval(updateStats,500);
function score(s,w){return Math.round(800*44/(44+w)+200*Math.min(1,180/s))}function finish(){if(finished)return;finished=true;let time=seconds();pending={id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),player,seconds:time,wrong,correct:44,score:score(time,wrong),accuracy:44/(44+wrong)};$('resultText').textContent=player+'｜'+pending.score+' 分｜'+fmt(time)+'｜正確率 '+(pending.accuracy*100).toFixed(1)+'%｜錯誤 '+wrong+' 次';$('result').showModal();submit()}
async function submit(){if(!pending||sending)return;sending=true;let run=pending;$('retrySubmit').hidden=true;$('submitStatus').textContent='儲存成績中…';try{let r=await fetch(API_URL,{method:'POST',body:JSON.stringify(run)});let d=await r.json();if(!d.ok)throw Error(d.error);$('submitStatus').textContent='成績已送交教師';if(pending===run)pending=null}catch(e){$('submitStatus').textContent='儲存失敗，請重試送出。';$('retrySubmit').hidden=false}finally{sending=false}}$('retrySubmit').onclick=submit;
$('again').onclick=()=>{if(sending)return;if(pending&&!confirm('成績尚未成功儲存，確定離開？'))return;pending=null;newPlayer()};
</script></html>
